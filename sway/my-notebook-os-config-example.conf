# bar configs
set $barfontsize 16
set $barheight 32
set $labelmode ~/.config/sway/handlers/metrics-battery.sh

# Set Theme
# include ~/.config/sway/themes/pinky.conf # pinky
include ~/.config/sway/themes/linux.conf # blacky

# Media
bindsym XF86MonBrightnessUp exec OP=d+ BF=$bf ~/.config/sway/handlers/media-brightnessctl.sh
bindsym XF86MonBrightnessDown exec OP=d- BF=$bf ~/.config/sway/handlers/media-brightnessctl.sh

bindsym XF86AudioRaiseVolume exec OP=v+ VF=$vf ~/.config/sway/handlers/media.sh
bindsym XF86AudioLowerVolume exec OP=v- VF=$vf ~/.config/sway/handlers/media.sh
bindsym XF86AudioMute exec OP=v0 ~/.config/sway/handlers/media.sh

# Keyboard Layout Switcher
bindsym $mod+Shift+Tab exec ~/.config/sway/handlers/keyboard-switch-layout.sh
